<article class="guide-page">
  <header class="guide-page__header">
    <div class="guide-page__badge">
      <span class="guide-page__badge-icon">&#x1F4C4;</span>
      <span>{{ 'guides.badge' | translate }}</span>
    </div>
    <h2 class="guide-page__title" id="guide-title-introduction">{{ page().title }}</h2>
    <p class="guide-page__lead">
      {{ page().lead }}
    </p>
  </header>

  <div class="guide-page__grid">
    <section class="guide-page__section guide-page__section--wide">
      <div class="section-header">
        <span class="section-icon">&#x1F4DA;</span>
        <h2 class="guide-page__subtitle" id="overview">{{ page().overviewTitle }}</h2>
      </div>
      <p class="guide-page__text">
        {{ page().overviewText }}
      </p>
      <div class="feature-grid">
        @for (feature of page().features; track feature.title) {
          <div class="feature-item">
            <div class="feature-item__inner">
              <span class="feature-item__icon">{{ feature.icon }}</span>
              <div class="feature-item__content">
                <h2 [id]="slugify(feature.title)">{{ feature.title }}</h2>
                <p>{{ feature.description }}</p>
              </div>
            </div>
          </div>
        }
      </div>
    </section>
  </div>
</article>
